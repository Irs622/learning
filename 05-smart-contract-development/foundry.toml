[profile.default]
src      = "src"
out      = "out"
libs     = ["lib"]
test     = "test"
script   = "script"

# Pin compiler version for reproducibility
solc_version = "0.8.24"

# Optimizer settings
optimizer      = true
optimizer_runs = 200

# Gas reporting in tests
gas_reports = ["*"]

# Verbosity: 0=silent, 1=test names, 2=logs, 3=traces, 4=full
verbosity = 2

# EVM version
evm_version = "paris"

# Fuzz testing
[fuzz]
runs    = 256
seed    = "0x1"

[profile.ci]
fuzz = { runs = 10000 }

[rpc_endpoints]
anvil   = "http://localhost:8545"
sepolia = "${SEPOLIA_RPC_URL}"

[etherscan]
sepolia = { key = "${ETHERSCAN_API_KEY}" }

# ── Profil jawaban (implementasi referensi) ─────────────────────────
# Jalankan HANYA setelah Anda mengerjakan sendiri.
#
#   FOUNDRY_PROFILE=solutions forge test
#     → test yang sama di test/ dijalankan terhadap solutions/src/ (bukan starter Anda)
#
#   FOUNDRY_PROFILE=answers forge test
#     → jawaban latihan "Lengkapi sendiri" (solutions/test/) terhadap solutions/src/
[profile.solutions]
src        = "solutions/src"
remappings = ["src/=solutions/src/", "forge-std/=lib/forge-std/src/"]

[profile.answers]
src        = "solutions/src"
test       = "solutions/test"
script     = "solutions/script"
remappings = ["src/=solutions/src/", "forge-std/=lib/forge-std/src/"]
