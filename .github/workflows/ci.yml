name: CI

# Menjaga repo pembelajaran tetap sehat:
# - kode referensi Phase 5 selalu bisa di-build & lulus test
# - jawaban di solutions/ tetap konsisten dengan contract
# - link antar-materi (anchor & file) tidak rusak
on:
  push:
    branches: [main]
  pull_request:

jobs:
  phase5-foundry:
    name: Phase 5 — build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 05-smart-contract-development
    steps:
      - uses: actions/checkout@v4

      - uses: foundry-rs/foundry-toolchain@v1

      - name: Install dependencies
        run: forge install foundry-rs/forge-std --no-git

      - name: Build starter (src/ harus selalu bisa di-compile)
        run: forge build --sizes

      # Test di test/ sengaja MERAH terhadap starter (pola TDD).
      # CI memvalidasi bahwa test tersebut lulus terhadap implementasi referensi.
      # Setelah Anda menyelesaikan Phase 5, tambahkan step `forge test -vv` (profil default)
      # agar CI juga memverifikasi kode ANDA.
      - name: Test — provided tests vs solutions/src
        run: FOUNDRY_PROFILE=solutions forge test -vv

      - name: Test — answers (solutions/test)
        run: FOUNDRY_PROFILE=answers forge test -vv

      - name: Simulate deployment with reference implementation (no broadcast)
        env:
          # Default anvil account #0 — PUBLIC key, hanya untuk simulasi lokal
          PRIVATE_KEY: "0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80"
        run: FOUNDRY_PROFILE=solutions forge script script/Deploy.s.sol:DeployAll

  markdown-links:
    name: Materi — cek link internal
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check anchors & relative links
        run: python3 -I .github/scripts/check_links.py
